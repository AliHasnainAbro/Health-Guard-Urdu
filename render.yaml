services:
  - type: web
    name: healthguard-urdu-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
