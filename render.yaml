services:
  - type: web
    name: healthguard-urdu-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://ws-de23fer3gmw7ckpd.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      - key: LLM_MODEL
        value: qwen3.7-max-2026-06-08
      - key: LLM_FALLBACK_MODEL
        value: qwen3.6-plus
      - key: FRONTEND_ORIGINS
        sync: false
